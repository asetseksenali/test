version: 2.1

jobs:
  failing-job:
    docker:
      - image: cimg/node:16.13
    steps:
      - checkout
      - run:
          name: "This step will fail"
          command: |
            echo "About to fail..."
            exit 1  # This command makes the job fail intentionally

workflows:
